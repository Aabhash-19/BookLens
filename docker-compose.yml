version: "3.9"

services:
  # ─── PostgreSQL with pgvector ─────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: booklens_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booklens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booklens_secret}
      POSTGRES_DB: ${POSTGRES_DB:-booklens}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booklens}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO Object Storage ─────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: booklens_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (rate limiting, caching, task queue) ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: booklens_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ───────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: booklens_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-booklens}:${POSTGRES_PASSWORD:-booklens_secret}@db:5432/${POSTGRES_DB:-booklens}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-booklens}:${POSTGRES_PASSWORD:-booklens_secret}@db:5432/${POSTGRES_DB:-booklens}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
      MINIO_BUCKET_NAME: book-scans
      MINIO_SECURE: "false"
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 43200
      OPEN_LIBRARY_BASE_URL: https://openlibrary.org
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - model_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Next.js Frontend ──────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: booklens_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_APP_NAME: BookLens
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  redis_data:
  model_cache:

networks:
  default:
    name: booklens_network
